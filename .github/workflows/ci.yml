name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production build — compiles and type-checks the app graph. The unit
      # suite reads a local (git-ignored) Strava export fixture, so it runs
      # locally via `npm test` rather than in CI.
      - run: npm run build
