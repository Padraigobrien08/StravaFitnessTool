name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck + lint + unit tests. Tests that depend on the git-ignored
      # Strava export fixture self-skip when it's absent (i.e. in CI).
      - run: npm run check
      - run: npm run build
