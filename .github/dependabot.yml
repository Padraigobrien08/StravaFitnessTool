version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch only minor/patch updates into single PRs to cut noise. Major
      # bumps intentionally arrive as individual PRs so each can be evaluated
      # (a grouped major once swept in unsupported TS 7 / ESLint 10 and broke
      # the build).
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
